<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proefexamen Wiskunde</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1f2328;--muted:#5d646e;--line:#dde2ea;--acc:#2563a8;--acc-ink:#fff;--soft:#e6eef8;
--ok:#1d7a46;--okbg:#e7f4ec;--bad:#b42318;--badbg:#fdecea;--f1:#c0760f;--f2:#2563a8;--f3:#7a3fa0;--fr:#b42318;--fill1:rgba(192,118,15,.13);--fill2:rgba(37,99,168,.13)}
@media (prefers-color-scheme:dark){:root{--bg:#16171a;--card:#212328;--ink:#ecebe7;--muted:#a3a7ae;--line:#35383e;--acc:#6ea8ef;--acc-ink:#111;--soft:#1c2a3b;
--ok:#4cc38a;--okbg:#16342a;--bad:#f2786c;--badbg:#3b1d1b;--f1:#e8a03c;--f2:#6ea8ef;--f3:#c58fe4;--fr:#f2786c;--fill1:rgba(232,160,60,.16);--fill2:rgba(110,168,239,.16)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
header h1{font-size:1.15rem;margin:0}
header span{color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
h2{margin:0 0 8px;font-size:1.4rem}
p{margin:.4em 0 .8em}
.muted{color:var(--muted)}
ul.topics{margin:.3em 0 1em;padding-left:1.2em}
label.f{display:block;font-weight:600;margin:14px 0 6px}
input[type=text]{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus{outline:none;border-color:var(--acc)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.tag{display:inline-block;font-size:.78rem;font-weight:600;color:var(--acc);background:var(--soft);padding:2px 9px;border-radius:99px;margin-bottom:8px}
.qtext{font-size:1.05rem}
.expr{font-size:1.35rem;font-weight:600;text-align:center;margin:12px 0;letter-spacing:.02em}
.choices{display:grid;gap:8px;margin-top:12px}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:12px}
.choice .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.choice.sel{border-color:var(--acc);background:var(--soft)}
.choice.sel .k{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.numrow{display:flex;align-items:center;gap:8px;margin-top:12px}
.numrow input{max-width:200px}
.numrow b{font-size:1.05rem}
.numrow .pm{padding:10px 12px;font-weight:700}
svg.fig{display:block;width:100%;max-width:420px;height:auto;margin:10px auto 4px}
svg.fig text{font:600 13px system-ui,sans-serif}
table.dtab{border-collapse:collapse;margin:10px auto;font-size:.95rem}
table.dtab th,table.dtab td{border:1px solid var(--line);padding:5px 10px;text-align:center}
table.dtab th{background:var(--soft)}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.dots button{width:34px;height:34px;padding:0;font-size:.8rem;border-radius:8px}
.dots button.ans{background:var(--soft);border-color:var(--acc)}
.dots button.cur{outline:2px solid var(--acc);outline-offset:1px}
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;font-weight:700}
.tbl{width:100%;border-collapse:collapse;margin-top:14px}
.tbl td{padding:6px 0;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:right;font-variant-numeric:tabular-nums;padding-left:10px}
.rev{border-left:4px solid var(--line);margin-top:14px}
.rev.ok{border-left-color:var(--ok)}
.rev.bad{border-left-color:var(--bad)}
.verd{font-weight:700}
.ok .verd{color:var(--ok)}
.bad .verd{color:var(--bad)}
.ans{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:.95rem}
.ans.mine{background:var(--bg)}
.rev.ok .ans.mine{background:var(--okbg)}
.rev.bad .ans.mine{background:var(--badbg)}
.ans.right{background:var(--okbg)}
.uitleg{margin-top:10px;font-size:.93rem;color:var(--muted)}
.hist{font-size:.9rem;margin-top:10px}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.gg>div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.gg b{font-size:.85rem;color:var(--acc);text-transform:uppercase;letter-spacing:.03em}
.gg ul{margin:4px 0 0;padding-left:1.1em}
.gg li{margin:2px 0}
@media (max-width:480px){.gg{grid-template-columns:1fr}}
.tip{margin-top:8px;font-size:.85rem;color:var(--muted)}
.hint{font-size:.85rem;color:var(--muted);margin-top:6px}
.small{font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Proefexamen Wiskunde</h1><span>1ste jaar</span></header>
  <main id="app"></main>
</div>
<script>
'use strict';
/* ===== Instellingen ===== */
const NTFY_TOPIC = 'wisk1plus-766x5zwkhb';        // uitslagen gaan naar https://ntfy.sh/<topic>
const QUOTA = {G:5, N:7, M:5, Z:6};               // aantal vragen per onderdeel (23 in totaal)
const TOPICS = {G:'Hfst 1 · Getallen', N:'Hfst 2 · Natuurlijke getallen', M:'Hfst 3 · Kijken en observeren', Z:'Hfst 8 · Gehele getallen'};
const KEY = 'wisk1';                              // voorvoegsel localStorage

/* ===== Hulpfuncties ===== */
const rint = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const range = (a,b) => Array.from({length:b-a+1},(_,i)=>a+i);
const f = (x,d=2) => (Math.round(x*10**d)/10**d).toLocaleString('nl-BE',{maximumFractionDigits:d,useGrouping:false});
const rad = d => d*Math.PI/180;
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const zf = n => n<0 ? '−'+(-n) : String(n);                 // −5
const zb = n => n<0 ? '(−'+(-n)+')' : '(+'+n+')';            // (−5) of (+3)
const big = n => (n<0?'−':'') + (Math.abs(n)>=1000 ? String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ') : String(Math.abs(n)));
const setS = a => a.length ? '{'+[...a].sort((x,y)=>x-y).join(', ')+'}' : '∅';
const gcd = (a,b) => b ? gcd(b,a%b) : a;
const lcm = (a,b) => a/gcd(a,b)*b;
const divs = n => range(1,n).filter(d=>n%d===0);
const digits = n => String(n).split('').map(Number);
const dsum = n => digits(n).reduce((s,d)=>s+d,0);
const uniq = a => [...new Set(a)];

/* Rekenvraag: korte situatie + (optioneel) vak Gegeven / Gevraagd. */
function num(text, answer, unit, uitleg, svg, geg, gevr){
  const box = geg ? `<div class="gg"><div><b>Gegeven</b><ul>${geg.map(x=>`<li>${x}</li>`).join('')}</ul></div><div><b>Gevraagd</b><ul><li>${gevr}</li></ul></div></div>` : '';
  if(!Number.isInteger(answer)) throw new Error('geen geheel antwoord');
  return {type:'num', text, gg:box, answer, unit:unit||'', uitleg, svg};
}
function mc(text, correct, wrong, uitleg, svg){
  const ch=shuffle([correct,...wrong]);
  if(new Set(ch).size!==ch.length) throw new Error('dubbele keuze');
  return {type:'mc', text, choices:ch, correct:ch.indexOf(correct), uitleg, svg};
}
function tf(text, truth, uitleg){ return {type:'mc', text:'<b>Waar of onwaar?</b> '+text, choices:['Waar','Onwaar'], correct:truth?0:1, uitleg}; }
/* n verschillende foute opties die niet gelijk zijn aan het juiste antwoord */
function others(correct, cands, n=3){ const o=uniq(cands.filter(x=>x!==correct)); if(o.length<n) throw new Error('te weinig opties'); return shuffle(o).slice(0,n); }
const tfPick = list => { const [t,w,u]=pick(list); return tf(t,w,u); };

/* ===== Figuren (SVG) ===== */
const svgW = (w,h,inner) => `<svg class="fig" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const T = (x,y,t,col='var(--ink)',anc='middle',sz) => `<text x="${x}" y="${y}" fill="${col}" text-anchor="${anc}"${sz?` style="font-size:${sz}px"`:''}>${t}</text>`;
const Ln = (x1,y1,x2,y2,col='var(--ink)',w=2,dash) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}"${dash?' stroke-dasharray="5 4"':''}/>`;
const Dot = (x,y,col='var(--ink)') => `<circle cx="${x}" cy="${y}" r="4" fill="${col}"/>`;

/* Venn-diagram met twee verzamelingen A en B die overlappen */
function figVenn(aO,I,bO,out){
  const SA=[[95,85],[80,120],[115,150],[125,110]], SI=[[190,80],[190,110],[190,140]], SB=[[285,85],[300,120],[265,150],[255,110]], SO=[[28,200],[352,200],[190,203]];
  let s=`<rect x="4" y="4" width="372" height="212" rx="10" fill="none" stroke="var(--muted)"/>`+
    `<circle cx="140" cy="110" r="85" fill="var(--fill1)" stroke="var(--f1)" stroke-width="2"/>`+
    `<circle cx="240" cy="110" r="85" fill="var(--fill2)" stroke="var(--f2)" stroke-width="2"/>`+
    T(66,36,'A','var(--f1)','middle',17)+T(314,36,'B','var(--f2)','middle',17);
  const put=(arr,sl)=>arr.forEach((v,i)=>{ s+=T(sl[i][0],sl[i][1]+6,v,'var(--ink)','middle',16); });
  put(aO,SA); put(I,SI); put(bO,SB); put(out,SO);
  return svgW(380,220,s);
}
/* Venn-diagram waarbij B helemaal binnen A ligt */
function figVennSub(aO,bI,out){
  const SA=[[110,85],[115,140],[160,55],[165,175]], SB=[[205,100],[235,115],[210,140]], SO=[[28,200],[352,200],[352,28]];
  let s=`<rect x="4" y="4" width="372" height="212" rx="10" fill="none" stroke="var(--muted)"/>`+
    `<circle cx="175" cy="112" r="98" fill="var(--fill1)" stroke="var(--f1)" stroke-width="2"/>`+
    `<circle cx="215" cy="118" r="48" fill="var(--fill2)" stroke="var(--f2)" stroke-width="2"/>`+
    T(90,34,'A','var(--f1)','middle',17)+T(268,72,'B','var(--f2)','middle',17);
  const put=(arr,sl)=>arr.forEach((v,i)=>{ s+=T(sl[i][0],sl[i][1]+6,v,'var(--ink)','middle',16); });
  put(aO,SA); put(bI,SB); put(out,SO);
  return svgW(380,220,s);
}
/* Staafdiagram */
function figBars(cats,vals,step,ylab){
  const x0=48,x1=350,y0=190,y1=26, top=Math.ceil(Math.max(...vals)/step)*step, sy=v=>y0-(v/top)*(y0-y1);
  let s='';
  for(let v=0;v<=top;v+=step) s+=Ln(x0,sy(v),x1,sy(v),'var(--line)',1)+T(x0-7,sy(v)+4,v,'var(--muted)','end',11);
  const bw=(x1-x0)/cats.length;
  cats.forEach((c,i)=>{ const x=x0+i*bw+bw*.2, w=bw*.6;
    s+=`<rect x="${x}" y="${sy(vals[i])}" width="${w}" height="${y0-sy(vals[i])}" fill="var(--f2)" rx="2"/>`+T(x+w/2,y0+18,c,'var(--ink)','middle',12); });
  s+=Ln(x0,y0,x1,y0,'var(--ink)',1.5)+Ln(x0,y0,x0,y1-8,'var(--ink)',1.5)+T(x0-40,14,ylab,'var(--muted)','start',11);
  return svgW(360,215,s);
}
/* Getallenas van lo tot hi; alleen de veelvouden van 5 krijgen een getal */
function figAs(lo,hi,pts){
  const x0=22,x1=338, X=v=>x0+(v-lo)/(hi-lo)*(x1-x0);
  let s=Ln(8,70,348,70,'var(--ink)',2)+`<polygon points="358,70 347,64 347,76" fill="var(--ink)"/>`;
  for(let v=lo;v<=hi;v++){ s+=Ln(X(v),63,X(v),77,'var(--ink)',v===0?2.6:1.3); if(v%5===0) s+=T(X(v),98,zf(v)); }
  for(const [l,v,c] of pts) s+=`<circle cx="${X(v)}" cy="70" r="5.5" fill="${c}"/>`+T(X(v),50,l,c,'middle',15);
  return svgW(366,110,s);
}
/* Twee rechten a en b: 'par' (evenwijdig), 'perp' (loodrecht), 'snij' (snijdend, niet loodrecht) */
function figLines(kind){
  const th=rad(rint(-20,20)), u=[Math.cos(th),-Math.sin(th)], nrm=[-u[1],u[0]], C=[180,110];
  const line=(p,d,L,lt,col,lab)=>{ const n=[-d[1],d[0]];
    return Ln(p[0]-L*d[0],p[1]-L*d[1],p[0]+L*d[0],p[1]+L*d[1],col,2.6)+T(p[0]+lt*d[0]+16*n[0],p[1]+lt*d[1]+16*n[1]+5,lab,col,'middle',16); };
  let s='';
  if(kind==='par'){ s=line([C[0]+32*nrm[0],C[1]+32*nrm[1]],u,165,140,'var(--f1)','a')+line([C[0]-32*nrm[0],C[1]-32*nrm[1]],u,165,140,'var(--f2)','b'); }
  else{
    const phi=kind==='perp'?90:pick([rint(30,60),rint(120,150)]), v=[Math.cos(th+rad(phi)),-Math.sin(th+rad(phi))];
    s=line(C,u,165,140,'var(--f1)','a')+line(C,v,100,88,'var(--f2)','b');
    if(kind==='perp') s+=`<polyline points="${C[0]+13*u[0]},${C[1]+13*u[1]} ${C[0]+13*u[0]+13*v[0]},${C[1]+13*u[1]+13*v[1]} ${C[0]+13*v[0]},${C[1]+13*v[1]}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`;
    const w=[-(u[0]+v[0]),-(u[1]+v[1])], wl=Math.hypot(...w)||1;
    s+=Dot(...C)+T(C[0]+20*w[0]/wl,C[1]+20*w[1]/wl+5,'S');
  }
  return svgW(360,220,s);
}
/* Rechthoek ABCD */
function figRect(){
  const A=[60,170],B=[300,170],C=[300,60],D=[60,60], m=12;
  return svgW(360,200,`<polygon points="${[A,B,C,D].map(p=>p.join(',')).join(' ')}" fill="var(--soft)" stroke="var(--ink)" stroke-width="2.4"/>`+
    `<polyline points="${A[0]+m},${A[1]} ${A[0]+m},${A[1]-m} ${A[0]},${A[1]-m}" fill="none" stroke="var(--ink)"/>`+
    `<polyline points="${B[0]-m},${B[1]} ${B[0]-m},${B[1]-m} ${B[0]},${B[1]-m}" fill="none" stroke="var(--ink)"/>`+
    `<polyline points="${C[0]-m},${C[1]} ${C[0]-m},${C[1]+m} ${C[0]},${C[1]+m}" fill="none" stroke="var(--ink)"/>`+
    `<polyline points="${D[0]+m},${D[1]} ${D[0]+m},${D[1]+m} ${D[0]},${D[1]+m}" fill="none" stroke="var(--ink)"/>`+
    T(46,188,'A')+T(314,188,'B')+T(314,52,'C')+T(46,52,'D'));
}
/* Rechte, lijnstuk of halfrechte door A en B */
function figBasic(kind,rev){
  const A=[110,62],B=[250,62]; let s;
  if(kind==='rechte') s=Ln(12,62,348,62,'var(--f2)',2.6);
  else if(kind==='lijnstuk') s=Ln(A[0],62,B[0],62,'var(--f2)',2.6)+Ln(A[0],54,A[0],70,'var(--f2)',2.6)+Ln(B[0],54,B[0],70,'var(--f2)',2.6);
  else s=rev ? Ln(12,62,B[0],62,'var(--f2)',2.6)+Ln(B[0],54,B[0],70,'var(--f2)',2.6) : Ln(A[0],62,348,62,'var(--f2)',2.6)+Ln(A[0],54,A[0],70,'var(--f2)',2.6);
  s+=Dot(...A)+Dot(...B)+T(A[0],44,'A')+T(B[0],44,'B');
  return svgW(360,90,s);
}
/* Punten op een rechte met afstanden */
function figSeg(ab,bc,ask){
  const tot=ab+bc, X=v=>30+v/tot*300, xs=[X(0),X(ab),X(tot)];
  let s=Ln(10,50,350,50,'var(--ink)',2)+xs.map(x=>Dot(x,50)).join('')+T(xs[0],34,'A')+T(xs[1],34,'B')+T(xs[2],34,'C');
  const dim=(x1,x2,y,t)=>Ln(x1,y,x2,y,'var(--muted)',1.2)+Ln(x1,y-5,x1,y+5,'var(--muted)',1.2)+Ln(x2,y-5,x2,y+5,'var(--muted)',1.2)+T((x1+x2)/2,y-6,t,'var(--muted)');
  s+=dim(xs[0],xs[1],80,ab+' cm');
  s+= ask==='AC' ? dim(xs[1],xs[2],80,bc+' cm')+dim(xs[0],xs[2],115,'?') : dim(xs[1],xs[2],80,'?')+dim(xs[0],xs[2],115,tot+' cm');
  return svgW(360,130,s);
}
function figPoints(n){
  const L='ABCDEF', xs=range(0,n-1).map(i=>40+i*280/(n-1));
  return svgW(360,80,Ln(10,50,350,50,'var(--ink)',2)+xs.map((x,i)=>Dot(x,50)+T(x,34,L[i])).join(''));
}
/* Ruimtefiguren en vlakke figuren */
const SOL={
  kubus: ()=>{ const F=[[80,70],[180,70],[180,170],[80,170]], o=[45,-35], Bk=F.map(p=>[p[0]+o[0],p[1]+o[1]]);
    return `<polygon points="${F.map(p=>p.join(',')).join(' ')}" fill="var(--soft)" stroke="var(--ink)" stroke-width="2"/>`+
      Ln(...F[0],...Bk[0])+Ln(...F[1],...Bk[1])+Ln(...F[2],...Bk[2])+Ln(...Bk[0],...Bk[1])+Ln(...Bk[1],...Bk[2])+
      Ln(...Bk[0],...Bk[3],'var(--muted)',1.5,1)+Ln(...Bk[3],...Bk[2],'var(--muted)',1.5,1)+Ln(...F[3],...Bk[3],'var(--muted)',1.5,1); },
  balk: ()=>{ const F=[[50,90],[200,90],[200,165],[50,165]], o=[55,-45], Bk=F.map(p=>[p[0]+o[0],p[1]+o[1]]);
    return `<polygon points="${F.map(p=>p.join(',')).join(' ')}" fill="var(--soft)" stroke="var(--ink)" stroke-width="2"/>`+
      Ln(...F[0],...Bk[0])+Ln(...F[1],...Bk[1])+Ln(...F[2],...Bk[2])+Ln(...Bk[0],...Bk[1])+Ln(...Bk[1],...Bk[2])+
      Ln(...Bk[0],...Bk[3],'var(--muted)',1.5,1)+Ln(...Bk[3],...Bk[2],'var(--muted)',1.5,1)+Ln(...F[3],...Bk[3],'var(--muted)',1.5,1); },
  prisma: ()=>{ const F=[[50,170],[160,170],[105,85]], o=[75,-40], Bk=F.map(p=>[p[0]+o[0],p[1]+o[1]]);
    return `<polygon points="${F.map(p=>p.join(',')).join(' ')}" fill="var(--soft)" stroke="var(--ink)" stroke-width="2"/>`+
      Ln(...F[1],...Bk[1])+Ln(...F[2],...Bk[2])+Ln(...Bk[1],...Bk[2])+
      Ln(...F[0],...Bk[0],'var(--muted)',1.5,1)+Ln(...Bk[0],...Bk[1],'var(--muted)',1.5,1)+Ln(...Bk[0],...Bk[2],'var(--muted)',1.5,1); },
  piramide: ()=>{ const a=[70,165],b=[190,165],c=[240,128],d=[120,128],t=[152,25];
    return `<polygon points="${[a,b,t].map(p=>p.join(',')).join(' ')}" fill="var(--soft)" stroke="var(--ink)" stroke-width="2"/>`+
      `<polygon points="${[b,c,t].map(p=>p.join(',')).join(' ')}" fill="var(--soft)" stroke="var(--ink)" stroke-width="2" fill-opacity=".6"/>`+

/* ===== Examen opbouwen ===== */
function gen(fn){ let err; for(let k=0;k<40;k++){ try{ return fn(); }catch(e){ err=e; } } throw err; }
function buildExam(){
  const qs=[];
  for(const t of Object.keys(QUOTA)){
    shuffle(BANK[t].map((_,i)=>i)).slice(0,QUOTA[t]).forEach(i=>{ const q=gen(BANK[t][i]); q.topic=t; q.gid=t+i; qs.push(q); });
  }
  return qs;
}
const parseNum = s => {
  if(s==null) return NaN;
  let t=String(s).replace(/[\s  ]/g,'').replace(/[−–]/g,'-').replace(/[a-zA-Z°€]+\.?$/,'');   // eenheid achteraan mag (12 cm)
  if(/^[-+]?\d{1,3}(\.\d{3})+$/.test(t)) t=t.replace(/\./g,'');   // 9.999 = negenduizend …
  t=t.replace(',','.');
  return /^[-+]?\d+(\.\d+)?$/.test(t) ? parseFloat(t) : NaN;
};
function isCorrect(q,a){
  if(q.type==='mc') return a===q.correct;
  const v=parseNum(a); return !isNaN(v) && Math.abs(v-q.answer)<1e-9;
}
const fmtAnswer = (q,a) => q.type==='mc' ? (a==null?'—':q.choices[a]) : (a==null||a===''?'—':esc(a)+(q.unit?' '+q.unit:''));
const fmtCorrect = q => q.type==='mc' ? q.choices[q.correct] : big(q.answer)+(q.unit?' '+q.unit:'');
const plain = s => String(s).replace(/<[^>]+>/g,'');

/* ===== Opslag ===== */
const store = {
  get(k,d){ try{ const v=localStorage.getItem(KEY+'_'+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(KEY+'_'+k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(KEY+'_'+k); }catch(e){} }
};
let S = store.get('state', null);
const save = () => store.set('state', S);

/* ===== Uitslag doorsturen (ntfy) ===== */
async function flushResults(){
  const q=store.get('outbox',[]); if(!q.length) return;
  const rest=[];
  for(const msg of q){
    try{ const r=await fetch('https://ntfy.sh/',{method:'POST',body:JSON.stringify(msg)}); if(!r.ok) rest.push(msg); }
    catch(e){ rest.push(msg); }
  }
  store.set('outbox',rest);
  const el=document.getElementById('sendstate');
  if(el) el.textContent = rest.length ? 'Uitslag nog niet doorgestuurd (geen verbinding?) — wordt later opnieuw geprobeerd.' : 'Uitslag doorgestuurd.';
}
function queueResult(){
  const r=S.result, n=S.questions.length;
  const per=Object.keys(TOPICS).map(t=>`${TOPICS[t]}: ${r.per[t][0]}/${r.per[t][1]}`).join('\n');
  const fout=S.questions.map((q,i)=>isCorrect(q,S.answers[i])?null:`V${i+1} (${TOPICS[q.topic]})${q.choices&&q.choices[0]==='Waar'?' «'+plain(q.text).replace('Waar of onwaar? ','').slice(0,90)+'»':''}: gaf ${S.answers[i]==null||S.answers[i]===''?'niets':plain(fmtAnswer(q,S.answers[i]))} — juist: ${plain(fmtCorrect(q))}`).filter(Boolean);
  const msg={topic:NTFY_TOPIC, title:`Wiskunde${S.name?' – '+S.name:''}: ${r.score}/${n} (${r.pct}%)`,
    message:`${new Date(r.end).toLocaleString('nl-BE')} · duur ${r.min} min\n\n${per}\n\n${fout.length?'Fout:\n'+fout.join('\n'):'Alles juist!'}`.slice(0,3900),
    tags:[r.pct>=50?'white_check_mark':'x'], priority:3};
  const q=store.get('outbox',[]); q.push(msg); store.set('outbox',q);
}

/* ===== Schermen ===== */
const app=document.getElementById('app');

  if(!S || !S.questions) return renderStart();
  if(S.finished) return S.reviewing ? renderReview() : renderResult();
  renderQuestion();
}

function renderQuestion(){
  const n=S.questions.length, i=S.cur, q=S.questions[i], a=S.answers[i];

  if(q.type==='mc') body=`<div class="choices">${q.choices.map((c,k)=>`<button class="choice ${a===k?'sel':''}" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${c}</span></button>`).join('')}</div>`;
  else body=`<div class="numrow"><button class="pm" id="pm" title="minteken">+/−</button><input type="text" inputmode="decimal" id="inp" placeholder="antwoord" value="${a!=null?esc(a):''}" autocomplete="off"><b>${q.unit}</b></div><div class="hint">Typ alleen het getal${q.unit?', de eenheid staat er al':''}. Een negatief getal? Typ een minteken (−) of tik op +/−.</div>`;
  app.innerHTML=`<div class="bar"><i style="width:${answered/n*100}%"></i></div>
   <div class="card">
    <span class="tag">${TOPICS[q.topic]}</span>

    <div class="dots">${S.questions.map((_,k)=>`<button data-go="${k}" class="${S.answers[k]!=null&&S.answers[k]!==''?'ans':''} ${k===i?'cur':''}">${k+1}</button>`).join('')}</div>
   </div>`;
  app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{ S.answers[i]=+b.dataset.k; save(); renderQuestion(); });
  const inp=document.getElementById('inp');
  if(inp){ inp.oninput=()=>{ S.answers[i]=inp.value; save(); };
           inp.onkeydown=e=>{ if(e.key==='Enter') (document.getElementById('next')||document.getElementById('done')).click(); };
           document.getElementById('pm').onclick=()=>{ const v=inp.value.trim(); inp.value=/^[-−–]/.test(v)?v.replace(/^[-−–]\s*/,''):'-'+v; S.answers[i]=inp.value; save(); inp.focus(); };
           if(matchMedia('(pointer:fine)').matches) inp.focus(); }
  const go=k=>{ S.cur=k; save(); renderQuestion(); window.scrollTo(0,0); };
  document.getElementById('prev').onclick=()=>go(i-1);

}
function finish(){
  const n=S.questions.length, open=n-S.answers.filter(x=>x!=null&&x!=='').length;
  if(open>0 && !confirm(`Je hebt nog ${open} vraag${open>1?'en':''} niet beantwoord. Toch indienen?`)) return;
  const per={}; Object.keys(TOPICS).forEach(t=>per[t]=[0,0]);
  let score=0; S.questions.forEach((q,i)=>{ const ok=isCorrect(q,S.answers[i]); per[q.topic][1]++; if(ok){score++; per[q.topic][0]++;} });
  const end=Date.now();
  S.result={score, pct:Math.round(score/n*100), per, end, min:Math.max(1,Math.round((end-S.start)/60000))};
  S.finished=true; S.reviewing=false; save();
  const h=store.get('hist',[]); h.push({d:end,s:score,n,p:S.result.pct}); store.set('hist',h);
  queueResult(); render(); window.scrollTo(0,0); flushResults();
}

       <div class="qtext">${q.text}</div>${q.svg||''}${q.gg||''}
       <div class="ans mine"><b>Jouw antwoord:</b> ${fmtAnswer(q,S.answers[i])}</div>
       ${ok?'':`<div class="ans right"><b>Juist antwoord:</b> ${fmtCorrect(q)}</div>`}
       <div class="uitleg">${q.uitleg}</div></div>`; }).join('')+
   `<div class="row"><button id="back2">← Uitslag</button><button class="pri" id="new">Nieuw proefexamen</button></div>`;
  const back=()=>{ S.reviewing=false; save(); render(); window.scrollTo(0,0); };
  document.getElementById('back').onclick=back; document.getElementById('back2').onclick=back;
  document.getElementById('new').onclick=()=>{ S=null; store.del('state'); render(); window.scrollTo(0,0); };
}
render();
flushResults();
</script>
</body>
</html>
